version: 2
updates:
  # Monitor GitHub Actions workflows for security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"

  # If you add npm dependencies in /docs later, uncomment this block:
  # - package-ecosystem: "npm"
  #   directory: "/docs"
  #   schedule:
  #     interval: "weekly"
  #   labels:
  #     - "dependencies"
  #     - "security"
  #   open-pull-requests-limit: 5
